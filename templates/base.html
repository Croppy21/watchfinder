<!doctype html>
<html>
  <head>
    <title>WatchFinder</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/newstyle.css?v=1.9" />
  </head>

  <body>
    <div class="container">{% block content %}{% endblock %}</div>

    <nav class="bottom-nav">
    <a
        href="/"
        class="nav-item {% if request.url.path == '/' %}active{% endif %}"
    >
        <img src="/static/icons/home.svg" alt="Home">
        <span>Home</span>
    </a>

    <a
        href="/search"
        class="nav-item {% if request.url.path == '/search' %}active{% endif %}"
    >
        <img src="/static/icons/search.svg" alt="Search">
        <span>Search</span>
    </a>

    <a
        href="/watchlist"
        class="nav-item {% if request.url.path == '/watchlist' %}active{% endif %}"
    >
        <img src="/static/icons/bookmark-black.svg" alt="Saved">
        <span>Saved</span>
    </a>

</nav>

    <script src="/static/app.js"></script>
  </body>
</html>
