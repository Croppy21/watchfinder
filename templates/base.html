<!doctype html>
<html>
  <head>
    <title>WatchFinder</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/newstyle.css?v=2.8" />
  </head>

  <body>
    {% set flash = request.session.pop("flash", None) %} {% if flash %}
    <div class="toast toast-{{ flash.category }}" id="toast">
      {% if flash.category == "success" %}
      <img src="/static/icons/checkmark-green.svg" alt="" />
      {% elif flash.category == "error" %}
      <span class="toast-error-icon">!</span>
      {% endif %}

      <span>{{ flash.message }}</span>
    </div>
    {% endif %}

    <div class="container">{% block content %}{% endblock %}</div>

    <nav class="bottom-nav">
      <a
        href="/"
        class="nav-item {% if request.url.path == '/' %}active{% endif %}"
      >
        <img src="/static/icons/home.svg" alt="Home" />
        <span>Home</span>
      </a>

      <a
        href="/search"
        class="nav-item {% if request.url.path == '/search' %}active{% endif %}"
      >
        <img src="/static/icons/search.svg" alt="Search" />
        <span>Search</span>
      </a>

      <a
        href="/watchlist"
        class="nav-item {% if request.url.path == '/watchlist' %}active{% endif %}"
      >
        <img src="/static/icons/bookmark-black.svg" alt="Watchlist" />
        <span>Watchlist</span>
      </a>
    </nav>

    <script src="/static/app.js?v=2.0"></script>
    <script>
      const toast = document.getElementById("toast");

      if (toast) {
        setTimeout(() => {
          toast.classList.add("toast-hide");

          setTimeout(() => {
            toast.remove();
          }, 300);
        }, 3000);
      }
    </script>
  </body>
</html>
