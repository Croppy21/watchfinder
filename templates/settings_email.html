{% extends "base.html" %}

{% block content %}

{% include "partials/top_nav.html" %}

<div class="auth-page">

    <div class="auth-header">
        <h1>Change email</h1>
        <p>Update the email address linked to your account.</p>
    </div>

    {% if error %}
    <div class="auth-message error">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="auth-message success">{{ success }}</div>
    {% endif %}

    <form method="post" action="/settings/email" class="auth-form">

        <div class="form-field">
            <label for="email">New email</label>

            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                value="{{ user.email }}"
            >
        </div>

        <button type="submit" class="auth-button">
            Save email
        </button>

    </form>

    <p class="auth-footer">
        <a href="/settings">Back to settings</a>
    </p>

</div>

{% endblock %}
