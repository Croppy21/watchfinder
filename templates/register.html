{% extends "base.html" %}

{% block content %}

{% include "partials/top_nav.html" %}

{% if error %}
    <p>{{ error }}</p>
{% endif %}

{% if success %}
    <p>{{ success }}</p>
{% endif %}

<h1>Create Account</h1>

<form method="post" action="/register">

    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        name="email"
        required
        autocomplete="email"
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        name="password"
        required
        autocomplete="new-password"
    >

    <button type="submit">
        Create Account
    </button>

</form>

<p>
    Already have an account?
    <a href="/login">Log in</a>
</p>

{% endblock %}
