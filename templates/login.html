{% extends "base.html" %} {% block content %} {% include "partials/top_nav.html"
%}

<div class="auth-page">
  <div class="auth-header">
    <h1>Welcome back</h1>
    <p>Log in to access your WatchFinder account.</p>
  </div>

  {% if error %}

  <div class="auth-message error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" class="auth-form">
    <input type="hidden" name="next_url" value="{{ next_url or '' }}" />

    <div class="form-field">
      <label for="login">Username or email</label>

      <input
        type="text"
        id="login"
        name="login"
        required
        autocomplete="username"
        placeholder="Username or email"
      />
    </div>

    <div class="form-field">
      <label for="password">Password</label>

      <div class="password-input-wrap">
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="Enter your password"
        />
        <button
          type="button"
          class="password-toggle"
          aria-label="Show password"
          aria-controls="password"
          aria-pressed="false"
        >
          <svg
            class="password-eye-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </div>

    <p class="auth-forgot-password">
      <a href="/forgot-password">Forgot your password?</a>
    </p>

    <button type="submit" class="auth-button">Log in</button>
  </form>

  <p class="auth-footer">
    Don't have an account?
    <a href="/register?next={{ next_url or '' }}"> Create one </a>
  </p>
</div>

{% endblock %}
